<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something is Coming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080a;
    --surface: #111115;
    --gold: #c9a84c;
    --gold-dim: #7a6130;
    --text: #e8e2d5;
    --muted: #6a6460;
    --accent: #d4af6a;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    cursor: none;
  }

  /* Custom cursor */
  #cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, opacity 0.2s;
    mix-blend-mode: difference;
  }
  #cursor-ring {
    position: fixed;
    width: 40px; height: 40px;
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.12s ease-out, width 0.3s, height 0.3s;
  }

  /* Canvas */
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* Main layout */
  .stage {
    position: relative;
    z-index: 10;
    width: 100vw; height: 100vh;
    display: grid;
    place-items: center;
  }

  .container {
    text-align: center;
    padding: 2rem;
    max-width: 780px;
  }

  /* Email form */
  .notify-form {
    display: flex;
    gap: 0;
    max-width: 420px;
    margin: 0 auto 4rem;
    opacity: 0;
    animation: fadeUp 1s 1.7s forwards;
    border: 1px solid var(--gold-dim);
    border-radius: 2px;
    overflow: hidden;
  }
  .notify-form input {
    flex: 1;
    background: rgba(201,168,76,0.05);
    border: none;
    outline: none;
    padding: 14px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .notify-form input::placeholder { color: var(--muted); }
  .notify-form button {
    background: var(--gold);
    border: none;
    padding: 14px 24px;
    color: #08080a;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: none;
    transition: background 0.2s;
  }
  .notify-form button:hover { background: var(--accent); }

  /* Countdown */
  .countdown {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s 1.7s forwards;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .number {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1;
    color: var(--text);
    min-width: 2ch;
    text-align: center;
  }
  .label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--gold-dim);
    text-transform: uppercase;
  }
  .sep {
    font-family: 'Instrument Serif', serif;
    font-size: 2.5rem;
    color: var(--gold-dim);
    line-height: 1;
    padding-top: 2px;
    opacity: 0.4;
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 60px; height: 60px;
    opacity: 0;
    animation: fadeIn 1.5s 2s forwards;
  }
  .corner svg { width: 100%; height: 100%; }
  .tl { top: 2rem; left: 2rem; }
  .tr { top: 2rem; right: 2rem; transform: scaleX(-1); }
  .bl { bottom: 2rem; left: 2rem; transform: scaleY(-1); }
  .br { bottom: 2rem; right: 2rem; transform: scale(-1); }

  /* Orb blob */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 1;
    animation: drift 12s ease-in-out infinite alternate;
  }
  .orb1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.06), transparent 70%);
    top: -100px; right: -100px;
    animation-duration: 14s;
  }
  .orb2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(100,60,150,0.08), transparent 70%);
    bottom: -80px; left: -80px;
    animation-duration: 10s;
    animation-delay: -4s;
  }

  /* Success state */
  .success-msg {
    display: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-top: 0.75rem;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(30px, 20px) scale(1.1); }
  }

  /* Noise grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 2;
    opacity: 0.035;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Hover reveal on tagline words */
  .word {
    display: inline-block;
    transition: color 0.3s, transform 0.3s;
    cursor: default;
  }
  .word:hover {
    color: var(--gold);
    transform: translateY(-2px);
  }

  @media (max-width: 600px) {
    .sep { display: none; }
    .countdown { gap: 1.5rem; }
    .notify-form { flex-direction: column; border: none; gap: 8px; }
    .notify-form input { border: 1px solid var(--gold-dim); }
    .notify-form button { width: 100%; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<canvas id="canvas"></canvas>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Corner decorations -->
<div class="corner tl">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 58 L2 2 L58 2" stroke="#7a6130" stroke-width="1" fill="none"/>
    <circle cx="2" cy="2" r="3" fill="#c9a84c"/>
    <path d="M10 2 L2 10" stroke="#7a6130" stroke-width="0.5"/>
  </svg>
</div>
<div class="corner tr">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 58 L2 2 L58 2" stroke="#7a6130" stroke-width="1" fill="none"/>
    <circle cx="2" cy="2" r="3" fill="#c9a84c"/>
    <path d="M10 2 L2 10" stroke="#7a6130" stroke-width="0.5"/>
  </svg>
</div>
<div class="corner bl">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 58 L2 2 L58 2" stroke="#7a6130" stroke-width="1" fill="none"/>
    <circle cx="2" cy="2" r="3" fill="#c9a84c"/>
    <path d="M10 2 L2 10" stroke="#7a6130" stroke-width="0.5"/>
  </svg>
</div>
<div class="corner br">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 58 L2 2 L58 2" stroke="#7a6130" stroke-width="1" fill="none"/>
    <circle cx="2" cy="2" r="3" fill="#c9a84c"/>
    <path d="M10 2 L2 10" stroke="#7a6130" stroke-width="0.5"/>
  </svg>
</div>

<div class="stage">
  <div class="container">

    <div class="notify-form" id="form-wrap">
      <input type="email" id="email-input" placeholder="your@email.com" />
      <button onclick="handleSubmit()">Notify me</button>
    </div>
    <p class="success-msg" id="success">✦ You're on the list. Stay curious.</p>

    <div class="countdown">
      <div class="unit">
        <span class="number" id="days">--</span>
        <span class="label">days</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="number" id="hours">--</span>
        <span class="label">hours</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="number" id="minutes">--</span>
        <span class="label">min</span>
      </div>
      <span class="sep">·</span>
      <div class="unit">
        <span class="number" id="seconds">--</span>
        <span class="label">sec</span>
      </div>
    </div>

  </div>
</div>

<script>
// ── Custom cursor ──
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function animCursor() {
  rx += (mx - rx) * 0.15;
  ry += (my - ry) * 0.15;
  cursor.style.left = mx + 'px';
  cursor.style.top = my + 'px';
  ring.style.left = rx + 'px';
  ring.style.top = ry + 'px';
  requestAnimationFrame(animCursor);
})();

// ── Particle canvas ──
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
let W, H, pts = [];

function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
}

function randomPt() {
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    size: Math.random() * 1.2 + 0.2,
    alpha: Math.random() * 0.5 + 0.1,
  };
}

function init() {
  resize();
  pts = Array.from({ length: 120 }, randomPt);
}

let mouseX = W / 2, mouseY = H / 2;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (let p of pts) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;

    // Mouse interaction
    const dx = mouseX - p.x;
    const dy = mouseY - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 100) {
      const force = (100 - dist) / 100;
      p.x -= dx * force * 0.02;
      p.y -= dy * force * 0.02;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201,168,76,${p.alpha})`;
    ctx.fill();
  }

  // Draw connecting lines
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x;
      const dy = pts[i].y - pts[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 110) {
        const opacity = (1 - d / 110) * 0.12;
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = `rgba(201,168,76,${opacity})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}

window.addEventListener('resize', init);
init();
draw();

// ── Countdown ──
const target = new Date();
target.setDate(target.getDate() + 47);
target.setHours(0, 0, 0, 0);

function pad(n) { return String(n).padStart(2, '0'); }

function tick() {
  const now = Date.now();
  const diff = target - now;
  if (diff <= 0) return;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('days').textContent = pad(d);
  document.getElementById('hours').textContent = pad(h);
  document.getElementById('minutes').textContent = pad(m);
  document.getElementById('seconds').textContent = pad(s);
}
tick();
setInterval(tick, 1000);

// ── Form submission ──
function handleSubmit() {
  const val = document.getElementById('email-input').value.trim();
  if (!val || !val.includes('@')) return;
  document.getElementById('form-wrap').style.display = 'none';
  const msg = document.getElementById('success');
  msg.style.display = 'block';
  msg.style.animation = 'fadeUp 0.6s forwards';
}

document.getElementById('email-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});

// ── Curiosity: Konami-style easter egg on typing "curious" ──
let typed = '';
document.addEventListener('keypress', e => {
  typed += e.key.toLowerCase();
  if (typed.includes('curious')) {
    typed = '';
    document.body.style.transition = 'filter 1.5s';
    document.body.style.filter = 'hue-rotate(40deg) brightness(1.2)';
    setTimeout(() => { document.body.style.filter = ''; }, 2000);
  }
  if (typed.length > 20) typed = typed.slice(-10);
});
</script>
</body>
</html>
